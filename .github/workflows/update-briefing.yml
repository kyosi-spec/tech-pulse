name: Update briefing

on:
  schedule:
    # Times are UTC. 11:12 and 22:12 UTC = about 6:12 AM and 5:12 PM Central (Daylight Time).
    - cron: "12 11,22 * * *"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: update-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install packages
        run: pip install -r pipeline/requirements.txt

      - name: Build briefing.json
        run: python pipeline/build_briefing.py
        env:
          # Optional. Add it under Settings → Secrets and variables → Actions for AI-written summaries.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save the new briefing
        run: |
          git config user.name "tech-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/briefing.json
          git diff --staged --quiet || git commit -m "Update briefing $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
